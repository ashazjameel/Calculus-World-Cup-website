<!DOCTYPE html>
<html lang="en">
    <head>
		<title>Calculus World Cup</title>
		<link rel="stylesheet" href="{{ url_for('static',filename='styles.css') }}">
		<script src="https://kit.fontawesome.com/a50dbe9f2c.js"></script>
		<script type="text/javascript" src="{{ url_for('static',filename='script.js') }}"></script>
		<link rel="icon" type="image/jpg" href="{{ url_for('static',filename='favicon.jpg') }}">
		<meta name="author" content="Ashaz Jameel">
		<meta name="google" content="notranslate">
	</head>

    <body>
		<h1 class="title">ℂ𝕒𝕝𝕔𝕦𝕝𝕦𝕤 𝕎𝕠𝕣𝕝𝕕 ℂ𝕦𝕡</h1>
		<button id="lightButton" class="light-button" type="button" onclick="lightDark()">☼</button>

		<div id=dropdown_div>
			<div>
				<label class="label" for="group_a"> The Big Leagues </label>
				<select class="dropdown" name="group_a" id="group_a" form="gamble_form">
					<option value="" selected disabled style="display:none;"> Group A selection </option>
					<option value="carson"> Carson </option>
					<option value="tyron"> Tyron </option>
					<option value="ashaz"> Ashaz </option>
					<option value="felix"> Felix </option>
				</select>
			</div>
			<div>
				<label class="label" for="group_b"> Pro League </label>
				<select class="dropdown" name="group_b" id="group_b" form="gamble_form">
					<option value="" selected disabled style="display:none;"> Group B selection </option>
					<option value="levi"> Levi </option>
					<option value="youssef"> Youssef </option>
					<option value="arham"> Arham </option>
					<option value="tim"> Tim </option>
				</select>
			</div>
			<div>
				<label class="label" for="group_c"> Intermediate League </label>
				<select class="dropdown" name="group_c" id="group_c" form="gamble_form">
					<option value="" selected disabled style="display:none;"> Group C selection </option>
					<option value="bhavya"> Bhavya </option>
					<option value="affan"> Affan </option>
					<option value="adeel"> Adeel </option>
					<option value="aariz"> Aariz </option>
				</select>
			</div>
			<div>
				<label class="label" for="group_d"> Dropout League </label>
				<select class="dropdown" name="group_d" id="group_d" form="gamble_form">
					<option value="" selected disabled style="display:none;"> Group D selection </option>
					<option value="rohaan"> Rohaan </option>
					<option value="ahmed_dia"> Ahmed Dia </option>
					<option value="eisa"> Eisa </option>
					<option value="brian"> Brian </option>
				</select>
			</div>
			<div>
				<label class="label" for="group_e"> Little League </label>
				<select class="dropdown" name="group_e" id="group_e" form="gamble_form">
					<option value="" selected disabled style="display:none;"> Group E selection </option>
					<option value="abuzar"> Abuzar </option>
					<option value="krish"> Krish </option>
					<option value="isaac"> Isaac </option>
					<option value="jawad"> Jawad </option>
				</select>
			</div>
		</div>
		
		<form method="POST" id="gamble_form">
			<input type="submit" value="Submit">
		</form>
		
		<p class="welcome"> Welcome, {{name}} </p>
    </body>
</html>
