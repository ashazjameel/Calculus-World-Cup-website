<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Calculus World Cup</title>
		    <link rel="stylesheet" href="{{ url_for('static',filename='styles.css') }}">
		    <script src="https://kit.fontawesome.com/a50dbe9f2c.js"></script>
		    <script type="text/javascript" src="{{ url_for('static',filename='script.js') }}"></script>
		    <link rel="icon" type="image/jpg" href="{{ url_for('static',filename='favicon.jpg') }}">
		    <meta name="author" content="Ashaz Jameel">
		    <meta name="google" content="notranslate">
    </head>
		
    <body>
		<h1 class="title">ℂ𝕒𝕝𝕔𝕦𝕝𝕦𝕤 𝕎𝕠𝕣𝕝𝕕 ℂ𝕦𝕡</h1>
		<button id="lightButton" class="light-button" type="button" onclick="lightDark()">☼</button>

		<div class="profile">
			<div class="pfp">
				<img inert src="{{pfp}}"></img>
				<span>{{name}}</span>
			</div>
			<div class="choices">
				<div>
					Group A:
					<div>{{group_a}}</div>
				</div>
				<div>
					Group B:
					<div>{{group_b}}</div>
				</div>
				<div>
					Group C:
					<div>{{group_c}}</div>
				</div>
				<div>
					Group D:
					<div>{{group_d}}</div>
				</div>
				<div>
					Group E:
					<div>{{group_e}}</div>
				</div>
			</div>
		</div>
		<div class="selection-text">
			<p> Selection: {{group_a}}, {{group_b}}, {{group_c}}, {{group_d}}, {{group_e}} </p>
		</div>
	</body>
</html>
